<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>gostore console</title>
<meta name="theme-color" content="#4f46e5">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="gostore">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%234f46e5'/%3E%3Cpath d='M8 11h16l-2 13H10z' fill='none' stroke='white' stroke-width='2.2' stroke-linejoin='round'/%3E%3Cpath d='M12 11V9a4 4 0 0 1 8 0v2' fill='none' stroke='white' stroke-width='2.2'/%3E%3C/svg%3E">
<style>
:root{
  --bg:#f6f7f9; --bg-tint:#eef0f4; --panel:#ffffff; --panel-2:#fbfbfd;
  --border:#e5e7eb; --border-2:#d6d9e0; --hairline:#eef0f3;
  --text:#111318; --text-2:#3f434d; --muted:#71757f; --faint:#9aa0ab;
  --accent:#4f46e5; --accent-2:#4338ca; --accent-soft:#eef0ff; --accent-fg:#fff;
  --green:#10a86a; --green-soft:#e7f7ef; --amber:#c2740a; --amber-soft:#fdf3e3;
  --red:#dc2b3d; --red-soft:#fdedef;
  --code-bg:#0f1220; --code-fg:#e6e7ef; --code-inline:#eef0f3;
  --shadow-sm:0 1px 2px rgba(17,19,24,.05);
  --shadow:0 2px 6px rgba(17,19,24,.06),0 10px 30px rgba(17,19,24,.08);
  --r1:7px; --r2:11px; --r3:16px;
  --mono:ui-monospace,"SF Mono",SFMono-Regular,"Cascadia Code",Menlo,Consolas,monospace;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Inter,Helvetica,Arial,sans-serif;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0c0d10; --bg-tint:#111318; --panel:#15171c; --panel-2:#191c22;
  --border:#262931; --border-2:#333742; --hairline:#20232a;
  --text:#f0f1f4; --text-2:#c7cad2; --muted:#8d929c; --faint:#666b76;
  --accent:#7c78ff; --accent-2:#918dff; --accent-soft:#20214a; --accent-fg:#fff;
  --green:#38d29a; --green-soft:#12281f; --amber:#e0a350; --amber-soft:#2b2314;
  --red:#ff5d6c; --red-soft:#2b1418;
  --code-bg:#0a0c14; --code-fg:#e6e7ef; --code-inline:#22252d;
  --shadow-sm:0 1px 2px rgba(0,0,0,.4);
  --shadow:0 2px 8px rgba(0,0,0,.5),0 16px 44px rgba(0,0,0,.55);
}}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.6 var(--sans);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}
h1,h2,h3,h4{margin:0;font-weight:650;letter-spacing:-.012em;line-height:1.25}
p{margin:0 0 .9em}
svg.i{width:16px;height:16px;flex:none;stroke-width:1.9}
::selection{background:var(--accent-soft)}

button{font:inherit;cursor:pointer;border:1px solid var(--border-2);background:var(--panel);color:var(--text);
  border-radius:var(--r1);padding:7px 13px;display:inline-flex;align-items:center;gap:7px;font-weight:550;
  transition:background .12s,border-color .12s,transform .05s,box-shadow .12s;white-space:nowrap}
button:hover{background:var(--panel-2);border-color:var(--muted)}
button:active{transform:translateY(.5px)}
button.primary{background:var(--accent);color:var(--accent-fg);border-color:transparent;box-shadow:var(--shadow-sm)}
button.primary:hover{background:var(--accent-2);border-color:transparent}
button.ghost{border-color:transparent;background:transparent;color:var(--text-2)}
button.ghost:hover{background:var(--bg-tint)}
button.danger{color:var(--red);border-color:color-mix(in srgb,var(--red) 45%,transparent)}
button.danger:hover{background:var(--red-soft)}
button.sm{padding:4px 9px;font-size:12.5px;border-radius:6px}
button:disabled{opacity:.45;cursor:default}
button.iconbtn{padding:6px;border-radius:6px}

input,select,textarea{font:inherit;padding:8px 11px;border:1px solid var(--border-2);border-radius:var(--r1);
  background:var(--panel);color:var(--text);width:100%;transition:border-color .12s,box-shadow .12s}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
textarea{resize:vertical;min-height:120px;font:12.5px/1.6 var(--mono)}
label.field-label{display:block;font-size:12px;font-weight:600;color:var(--muted);margin-bottom:5px;letter-spacing:.01em}

code{font:12.5px var(--mono);background:var(--code-inline);padding:1.5px 5px;border-radius:5px;color:var(--text)}
.hidden{display:none!important}
.muted{color:var(--muted)} .small{font-size:12.5px}
.spin{width:15px;height:15px;border:2px solid var(--border-2);border-top-color:var(--accent);border-radius:50%;
  animation:sp .7s linear infinite;display:inline-block}
@keyframes sp{to{transform:rotate(360deg)}}
.row{display:flex;gap:10px;align-items:center}
.grow{flex:1}

/* ---------- login ---------- */
#login{max-width:410px;margin:10vh auto;padding:36px 34px;background:var(--panel);border:1px solid var(--border);
  border-radius:var(--r3);box-shadow:var(--shadow)}
#login .brand{display:flex;align-items:center;gap:11px;margin-bottom:22px}
#login .logo{width:38px;height:38px;border-radius:10px;background:linear-gradient(140deg,var(--accent),var(--accent-2));
  display:grid;place-items:center;box-shadow:var(--shadow-sm)}
#login h1{font-size:19px}
#login .sub{color:var(--muted);font-size:13px;margin-top:2px}
#login label.field-label{margin-top:15px}
#login button{width:100%;justify-content:center;margin-top:20px;padding:10px}
#loginErr{color:var(--red);font-size:13px;margin-top:12px;min-height:18px}
#login .hint{margin-top:16px;font-size:12px;color:var(--faint);text-align:center}

/* ---------- shell ---------- */
#app{display:grid;grid-template-columns:250px 1fr;height:100%}
aside.nav{background:var(--bg-tint);border-right:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden}
.nav .top{display:flex;align-items:center;gap:10px;padding:16px 18px 14px;font-weight:700;font-size:15px;letter-spacing:-.01em}
.nav .top .logo{width:26px;height:26px;border-radius:8px;background:linear-gradient(140deg,var(--accent),var(--accent-2));
  display:grid;place-items:center}
.nav .scroll{flex:1;overflow-y:auto;padding:6px 10px 14px}
.nav .grp{margin-top:14px;padding:0 10px 4px;font-size:10.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--faint)}
.nav a{display:flex;align-items:center;gap:10px;padding:8px 11px;border-radius:8px;color:var(--text-2);font-weight:550;font-size:13.5px;cursor:pointer}
.nav a .i{color:var(--muted);transition:color .12s}
.nav a:hover{background:var(--panel);text-decoration:none}
.nav a.active{background:var(--accent);color:var(--accent-fg)}
.nav a.active .i{color:var(--accent-fg)}
.nav a.sub{padding-left:34px;font-size:13px;font-weight:500}
.nav .foot{border-top:1px solid var(--border);padding:12px 16px;display:flex;align-items:center;gap:10px;font-size:12.5px;color:var(--muted)}
.nav .foot .who{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

main{overflow-y:auto;overflow-x:hidden}
.wrap{max-width:1080px;margin:0 auto;padding:30px 34px 80px}
.wrap.docs{max-width:820px}
.pageh{display:flex;align-items:flex-start;gap:14px;margin-bottom:6px}
.pageh h2{font-size:22px}
.pageh .desc{color:var(--muted);font-size:13.5px;margin-top:3px}
.pageh .actions{margin-left:auto;display:flex;gap:9px;align-items:center;flex-wrap:wrap}
.toolbar{display:flex;gap:10px;align-items:center;margin:18px 0;flex-wrap:wrap}
.search{position:relative;min-width:230px;flex:1;max-width:340px}
.search .i{position:absolute;left:10px;top:9px;color:var(--faint)}
.search input{padding-left:32px}

/* ---------- cards / tables ---------- */
.card{background:var(--panel);border:1px solid var(--border);border-radius:var(--r2);box-shadow:var(--shadow-sm)}
.card.pad{padding:20px}
.grid{display:grid;gap:14px}
.stat-tiles{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.tile{background:var(--panel);border:1px solid var(--border);border-radius:var(--r2);padding:15px 16px;box-shadow:var(--shadow-sm)}
.tile .k{font-size:11.5px;font-weight:600;letter-spacing:.03em;text-transform:uppercase;color:var(--faint);display:flex;align-items:center;gap:6px}
.tile .v{font-size:23px;font-weight:700;margin-top:6px;letter-spacing:-.02em}
.tile .v small{font-size:13px;font-weight:600;color:var(--muted)}

table{width:100%;border-collapse:collapse}
thead th{text-align:left;padding:11px 16px;font-size:11.5px;font-weight:650;letter-spacing:.03em;text-transform:uppercase;
  color:var(--faint);background:var(--panel-2);border-bottom:1px solid var(--border)}
tbody td{padding:11px 16px;font-size:13.5px;border-bottom:1px solid var(--hairline);vertical-align:middle}
tbody tr:last-child td{border-bottom:0}
tbody tr.clk{cursor:pointer}
tbody tr.clk:hover{background:var(--bg-tint)}
thead th.sorth{cursor:pointer;user-select:none}
thead th.sorth:hover{color:var(--text-2)}
thead th.sorth.on{color:var(--text)}
thead th .sarrow{font-size:10px}
td.num{text-align:right;font-variant-numeric:tabular-nums;color:var(--muted);white-space:nowrap}
th.num{text-align:right}
td.act{text-align:right;white-space:nowrap}
td .nm{display:flex;align-items:center;gap:9px;min-width:0}
td .nm .i{color:var(--faint)} td .nm.folder .i{color:var(--accent)}
td .nm span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pill{display:inline-flex;align-items:center;gap:5px;background:var(--code-inline);border-radius:999px;padding:2.5px 9px;
  font-size:11.5px;font-weight:550;color:var(--text-2);margin:2px 4px 2px 0}
.pill.ok{background:var(--green-soft);color:var(--green)}
.pill.warn{background:var(--amber-soft);color:var(--amber)}
.empty{padding:60px 20px;text-align:center;color:var(--muted)}
.empty .i{width:34px;height:34px;color:var(--border-2);stroke-width:1.5}
.empty h3{margin:12px 0 4px;font-size:15px;color:var(--text-2)}

.crumbs{display:flex;align-items:center;gap:7px;color:var(--muted);font-size:13px;margin:10px 0 4px;flex-wrap:wrap}
.crumbs a{color:var(--muted);cursor:pointer} .crumbs a:hover{color:var(--text);text-decoration:none}
.crumbs .sep{color:var(--faint)}

/* ---------- endpoint hero ---------- */
.hero{background:linear-gradient(135deg,var(--accent-soft),transparent 70%);border:1px solid var(--border);
  border-radius:var(--r3);padding:22px 24px;margin-bottom:20px}
.hero h3{font-size:14px;color:var(--text-2);display:flex;align-items:center;gap:8px}
.kvbig{display:grid;grid-template-columns:auto 1fr;gap:8px 18px;margin-top:14px;align-items:center}
.kvbig .k{font-size:12px;font-weight:600;color:var(--muted)}
.kvbig .v{font:13px var(--mono);display:flex;align-items:center;gap:8px}
.kvbig .v code{background:var(--panel);border:1px solid var(--border);padding:4px 9px}

/* ---------- code block ---------- */
.code{position:relative;background:var(--code-bg);border-radius:var(--r2);margin:14px 0;overflow:hidden;border:1px solid rgba(255,255,255,.06)}
.code .bar{display:flex;align-items:center;gap:8px;padding:8px 12px;border-bottom:1px solid rgba(255,255,255,.07);
  font:11.5px var(--mono);color:#9aa0b4}
.code .bar .lang{flex:1;text-transform:uppercase;letter-spacing:.06em;font-weight:600}
.code .bar button{background:rgba(255,255,255,.06);border:0;color:#c9cde0;padding:3px 9px;font-size:11.5px}
.code .bar button:hover{background:rgba(255,255,255,.13)}
.code pre{margin:0;padding:14px 16px;overflow-x:auto;font:12.5px/1.7 var(--mono);color:var(--code-fg)}
.code pre .tok-c{color:#6b7394} .code pre .tok-s{color:#9ece6a} .code pre .tok-k{color:#bb9af7}
.code pre .tok-n{color:#7dcfff} .code pre .tok-f{color:#7aa2f7}

/* docs hub */
.docs-shell{display:grid;grid-template-columns:236px 1fr;gap:34px;align-items:start}
.docs-toc{position:sticky;top:0;align-self:start;max-height:calc(100vh - 40px);overflow-y:auto;padding-right:6px}
.docs-toc .grp{font-size:10.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--faint);
  margin:16px 4px 6px}
.docs-toc .grp:first-child{margin-top:0}
.docs-toc a{display:block;padding:6px 11px;border-radius:7px;font-size:13px;color:var(--text-2);cursor:pointer;font-weight:500}
.docs-toc a:hover{background:var(--bg-tint);text-decoration:none}
.docs-toc a.active{background:var(--accent);color:var(--accent-fg);font-weight:600}
.docs-content{min-width:0}
@media (max-width:900px){
  .docs-shell{grid-template-columns:1fr;gap:12px}
  .docs-toc{position:static;max-height:none;border-bottom:1px solid var(--border);padding-bottom:10px}
}
/* reading mode: hide the app sidebar while a doc is open */
#app.reading{grid-template-columns:1fr}
#app.reading aside.nav{display:none}
.docs-back{display:inline-flex;align-items:center;gap:7px;font-size:13px;font-weight:600;
  color:var(--text-2);cursor:pointer;margin-bottom:14px;user-select:none}
.docs-back:hover{color:var(--text)}
.docs-back svg{width:16px;height:16px}
.creds-row{display:flex;gap:8px;align-items:center;margin:2px 0 12px}
.creds-row input{flex:1;font-family:var(--mono);font-size:12.5px}
.thumb{display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;flex:0 0 28px;
  border-radius:6px;overflow:hidden;background:var(--bg-tint)}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb svg{width:16px;height:16px}

/* docs prose */
.prose h2{font-size:24px;margin:0 0 6px}
.prose h3{font-size:16px;margin:30px 0 8px}
.prose>p:first-of-type{font-size:15px;color:var(--text-2)}
.prose ul,.prose ol{margin:.4em 0 1em;padding-left:22px} .prose li{margin:.28em 0}
.prose table{margin:14px 0;border:1px solid var(--border);border-radius:var(--r2);overflow:hidden}
.prose table td{font-size:13px}
.callout{border:1px solid var(--border);border-left:3px solid var(--accent);background:var(--panel-2);
  border-radius:var(--r1);padding:12px 15px;margin:14px 0;font-size:13.5px}
.callout.tip{border-left-color:var(--green)} .callout.warn{border-left-color:var(--amber)}
.callout b{display:block;margin-bottom:3px;font-size:12.5px;letter-spacing:.02em}
.optbl{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px;margin:12px 0}
.optbl div{border:1px solid var(--border);border-radius:var(--r1);padding:9px 12px;font-size:12.5px;background:var(--panel-2)}
.optbl code{background:none;padding:0;color:var(--accent)}

/* ---------- drawer / modal / toast ---------- */
#scrim{position:fixed;inset:0;background:rgba(8,10,18,.45);opacity:0;pointer-events:none;transition:opacity .18s;z-index:40;backdrop-filter:blur(2px)}
#scrim.on{opacity:1;pointer-events:auto}
#drawer{position:fixed;top:0;right:0;height:100%;width:min(480px,94vw);background:var(--panel);border-left:1px solid var(--border);
  box-shadow:var(--shadow);transform:translateX(101%);transition:transform .22s cubic-bezier(.4,0,.2,1);z-index:41;display:flex;flex-direction:column}
#drawer.on{transform:none}
#drawer .dh{display:flex;align-items:center;gap:11px;padding:17px 19px;border-bottom:1px solid var(--border)}
#drawer .dh h3{font-size:15px;flex:1;word-break:break-all}
#drawer .tabs{display:flex;gap:2px;padding:9px 12px 0;border-bottom:1px solid var(--border);background:var(--panel-2)}
#drawer .tabs button{border:0;background:transparent;color:var(--muted);border-radius:7px 7px 0 0;padding:8px 13px;font-size:13px}
#drawer .tabs button.on{color:var(--text);background:var(--panel);box-shadow:inset 0 -2px 0 var(--accent)}
#drawer .db{padding:19px;overflow:auto;flex:1}
.kv{display:grid;grid-template-columns:120px 1fr;gap:7px 14px;font-size:13px;margin:2px 0 16px}
.kv .k{color:var(--muted)} .kv .v{word-break:break-all}

#toast{position:fixed;right:20px;bottom:20px;display:flex;flex-direction:column;gap:9px;z-index:60}
#toast div{background:var(--panel);border:1px solid var(--border);border-left:3px solid var(--accent);border-radius:var(--r1);
  padding:11px 15px;box-shadow:var(--shadow);max-width:360px;font-size:13px;animation:tin .2s ease}
#toast div.err{border-left-color:var(--red)} #toast div.ok{border-left-color:var(--green)}
@keyframes tin{from{transform:translateX(16px);opacity:0}}

dialog{border:1px solid var(--border);border-radius:var(--r3);background:var(--panel);color:var(--text);padding:26px;max-width:480px;width:92%;box-shadow:var(--shadow)}
dialog::backdrop{background:rgba(8,10,18,.5);backdrop-filter:blur(2px)}
dialog h3{font-size:17px;margin-bottom:5px}
dialog .hint{color:var(--muted);font-size:12.5px;margin-bottom:14px}
dialog label.field-label{margin-top:12px}
dialog .btns{display:flex;gap:9px;justify-content:flex-end;margin-top:22px}

#uplist{margin:10px 0;display:flex;flex-direction:column;gap:6px}
#uplist .up{display:flex;align-items:center;gap:10px;font-size:12.5px;color:var(--muted)}
#uplist .up .bar{flex:1;height:5px;background:var(--code-inline);border-radius:99px;overflow:hidden}
#uplist .up .bar>span{display:block;height:100%;background:var(--accent);width:0;transition:width .25s}
#drop.hot{outline:2px dashed var(--accent);outline-offset:-6px;border-radius:var(--r2);background:var(--accent-soft)}

@media (max-width:860px){
  #app{grid-template-columns:1fr}
  aside.nav{position:fixed;z-index:50;width:min(280px,82vw);height:100%;transform:translateX(-101%);transition:transform .2s;box-shadow:var(--shadow)}
  aside.nav.open{transform:none}
  /* clear the fixed hamburger so it never sits on top of the page title;
     add iOS safe-area insets for standalone (installed PWA) display */
  .wrap{padding:calc(60px + env(safe-area-inset-top,0px)) calc(16px + env(safe-area-inset-right,0px)) 56px calc(16px + env(safe-area-inset-left,0px))}
  .wrap.docs{padding:calc(60px + env(safe-area-inset-top,0px)) 16px 56px}
  #menuBtn{display:inline-flex!important}
  .pageh{flex-wrap:wrap}
  .pageh h2{font-size:20px}
  .pageh .actions{margin-left:0;width:100%;margin-top:10px}
  .toolbar{gap:8px}
  .search{flex:1 1 100%;min-width:0;max-width:none;width:100%}
  .hero{padding:18px 16px}
  .kvbig{grid-template-columns:1fr;gap:4px 0}
  .kvbig .k{margin-top:8px}
  .kvbig .v{flex-wrap:wrap}
  .stat-tiles{grid-template-columns:1fr 1fr!important}
  .tile .v{font-size:20px}
  /* wide tables scroll horizontally instead of overflowing the viewport */
  .card{overflow-x:auto;-webkit-overflow-scrolling:touch}
  thead th,tbody td{padding:10px 12px}
  #drawer{width:100vw}
  dialog{width:94%;padding:20px}
  .code pre{font-size:11.5px}
}
#menuBtn{display:none;position:fixed;top:calc(12px + env(safe-area-inset-top,0px));left:calc(12px + env(safe-area-inset-left,0px));z-index:55;background:var(--panel);box-shadow:var(--shadow-sm)}

/* ============ visual polish (v2) ============ */
body{background:
  radial-gradient(1100px 520px at 100% -12%, color-mix(in srgb,var(--accent) 11%,transparent), transparent 62%),
  radial-gradient(900px 480px at -10% 8%, color-mix(in srgb,var(--accent) 7%,transparent), transparent 60%),
  var(--bg);background-attachment:fixed}
aside.nav{background:linear-gradient(185deg,var(--bg-tint),var(--bg) 85%)}
.nav .top .logo,#login .logo{background:linear-gradient(140deg,#7c6dff,#4f46e5 55%,#3b2fcf);
  box-shadow:0 6px 16px -6px color-mix(in srgb,var(--accent) 65%,transparent)}
.nav a{transition:background .12s,color .12s}
.nav a.active{background:linear-gradient(135deg,var(--accent),var(--accent-2));
  box-shadow:0 8px 18px -8px color-mix(in srgb,var(--accent) 75%,transparent)}
.pageh h2{background:linear-gradient(180deg,var(--text),color-mix(in srgb,var(--text) 68%,var(--muted)));
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}

.tile{position:relative;overflow:hidden;transition:transform .13s cubic-bezier(.4,0,.2,1),box-shadow .13s,border-color .13s}
.tile::after{content:"";position:absolute;inset:0 0 auto 0;height:2px;
  background:linear-gradient(90deg,var(--accent),transparent 65%);opacity:.7}
.tile:hover{transform:translateY(-3px);box-shadow:var(--shadow);border-color:var(--border-2)}
.tile .k .i{color:var(--accent)}

.hero{background:
  radial-gradient(520px 220px at 2% 0%, color-mix(in srgb,var(--accent) 17%,transparent), transparent 72%),
  linear-gradient(135deg,var(--accent-soft),transparent 74%);position:relative;overflow:hidden}
.hero::before{content:"";position:absolute;right:-40px;top:-40px;width:200px;height:200px;border-radius:50%;
  background:radial-gradient(closest-side,color-mix(in srgb,var(--accent) 14%,transparent),transparent);pointer-events:none}

button.primary{background:linear-gradient(135deg,var(--accent),var(--accent-2));
  box-shadow:0 6px 16px -8px color-mix(in srgb,var(--accent) 80%,transparent)}
button.primary:hover{filter:brightness(1.06)}

#login{background:linear-gradient(180deg,var(--panel),var(--panel-2));
  box-shadow:var(--shadow),0 0 0 1px color-mix(in srgb,var(--accent) 8%,transparent)}

/* disk usage bar (dashboard) */
.cap{background:var(--panel);border:1px solid var(--border);border-radius:var(--r2);
  padding:16px 18px;box-shadow:var(--shadow-sm);margin-top:14px}
.cap .caph{display:flex;align-items:center;gap:9px;margin-bottom:11px}
.cap .caph .i{color:var(--accent)}
.cap .caph .t{font-size:11.5px;font-weight:650;letter-spacing:.04em;text-transform:uppercase;color:var(--faint)}
.cap .caph .pct{margin-left:auto;font-size:14px;font-weight:700;letter-spacing:-.01em}
.cap .track{height:10px;border-radius:99px;background:var(--code-inline);overflow:hidden}
.cap .track>span{display:block;height:100%;border-radius:99px;
  background:linear-gradient(90deg,var(--accent),#8b5cf6);transition:width .5s cubic-bezier(.4,0,.2,1)}
.cap .track>span.warn{background:linear-gradient(90deg,var(--amber),#e07a1a)}
.cap .track>span.crit{background:linear-gradient(90deg,var(--red),#e0661a)}
.cap .lbl{display:flex;justify-content:space-between;margin-top:9px;font-size:12.5px;color:var(--muted)}
.cap .lbl b{color:var(--text-2);font-weight:600}
</style>
</head>
<body>

<section id="login">
  <div class="brand">
    <span class="logo"><svg class="i" style="width:22px;height:22px" viewBox="0 0 24 24" fill="none" stroke="#fff"><path d="M5 8h14l-1.6 12.5A2 2 0 0 1 15.4 22H8.6a2 2 0 0 1-2-1.5L5 8z"/><path d="M8 8V6a4 4 0 0 1 8 0v2"/></svg></span>
    <div><h1>gostore</h1><div class="sub">S3-compatible object storage</div></div>
  </div>
  <label class="field-label">Access Key</label>
  <input id="ak" autocomplete="username" autofocus spellcheck="false">
  <label class="field-label">Secret Key</label>
  <input id="sk" type="password" autocomplete="current-password">
  <button class="primary" id="loginBtn">Sign in</button>
  <div id="loginErr"></div>
  <div class="hint">Use the root credentials or any access key you created.</div>
</section>

<button id="menuBtn" class="iconbtn" aria-label="menu"><svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>

<div id="app" class="hidden">
  <aside class="nav" id="sidenav">
    <div class="top">
      <span class="logo"><svg class="i" viewBox="0 0 24 24" fill="none" stroke="#fff"><path d="M5 8h14l-1.6 12.5A2 2 0 0 1 15.4 22H8.6a2 2 0 0 1-2-1.5L5 8z"/><path d="M8 8V6a4 4 0 0 1 8 0v2"/></svg></span>
      gostore
    </div>
    <div class="scroll" id="navlinks"></div>
    <div class="foot">
      <svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>
      <span class="who" id="whoami"></span>
      <button class="ghost iconbtn" id="logout" title="Sign out"><svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></svg></button>
    </div>
  </aside>
  <main><div class="wrap" id="view"></div></main>
</div>

<div id="scrim"></div>
<aside id="drawer"></aside>
<div id="toast"></div>
<dialog id="modal"></dialog>

<script src="app.js"></script>
<script>
// Register the PWA service worker (static shell caching only; API traffic is
// never intercepted). Best-effort — the console works without it.
if ("serviceWorker" in navigator) {
  addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
}
</script>
</body>
</html>
